name: profile-pipeline

on:
  schedule:
    - cron: "0 18 * * *"        # 00:00 Asia/Dhaka (UTC+6, no DST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cards/**", "pipeline/**", "tests/**", ".github/workflows/profile.yml"]

permissions:
  contents: write                # to commit regenerated assets/

concurrency:
  group: profile-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Standard library only: ubuntu-latest ships Python 3.12, nothing to install.
      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Extract, validate, render, audit, publish
        run: python3 -m pipeline.run --mode live --out assets
        env:
          # Optional PROFILE_TOKEN (fine-grained PAT, read-only) takes precedence if set.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      # Commits are authored by the Actions bot, so they never count toward
      # the owner's contribution graph (no padding the gauge it draws).
      - name: Commit assets and README if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(profile): pipeline run ${{ github.run_number }}"
            git push
          fi
