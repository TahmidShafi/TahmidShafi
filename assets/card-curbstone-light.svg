<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="t d"><title id="t">curbstone project card</title><desc id="d">curbstone: Flags likely fabricated survey interviews by comparing each enumerator with peers who worked the same villages. Result: +0.131 precision@4 over rule counts (95% CI +0.119 to +0.142, ranked against a rule-count baseline). Limitation: Synthetic data, no real-world validation yet. A risk ranking, not calibrated flagging.</desc><style>
