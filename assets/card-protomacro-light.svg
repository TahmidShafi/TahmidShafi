<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="t d"><title id="t">ProtoMacro project card</title><desc id="d">ProtoMacro: Local-first nutrition PWA backed by a sourced Bangladeshi food database, built by a tested DuckDB pipeline. Result: 567 foods, with provenance recorded on every row (104 Vitest + 8 pytest tests; hard errors fail the build). Limitation: 283 of 381 FCTB values are borrowed from secondary tables, and FCTB dates from 2013.</desc><style>
    .sans { font-family: Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    .bn { font-family: 'Noto Sans Bengali','Nirmala UI','Bangla Sangam MN',Vrinda,sans-serif; }
    .fg { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #9a6b00; }
    .accent2 { fill: #4f7d23; }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    .fade { animation: fade 1.2s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .motion { display: none; }
    }
    
    .grow { animation: grow 1s .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    .bar { transform-box: fill-box; transform-origin: left center;
      animation: bar 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes bar { from { transform: scaleX(0); } }
    .pop { transform-box: fill-box; transform-origin: center;
      animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes pop { from { transform: scale(0); } }
    </style>
    <rect x="0.5" y="0.5" width="479" height="349" rx="14" fill="#ffffff" stroke="#d0d7de"/>
