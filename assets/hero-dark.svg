<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Tahmid Jawad Shafi — data engineering</title><desc id="d">Tahmid Jawad Shafi, data engineering and analytics. An animated river delta shows his data sources (DGHS portal, Open-Meteo, FCTB 2013, BBS HIES 2022, simulators) merging through extract, validate and transform stages into published outputs.</desc><style>
    .sans { font-family: Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    .bn { font-family: 'Noto Sans Bengali','Nirmala UI','Bangla Sangam MN',Vrinda,sans-serif; }
    .fg { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .accent { fill: #e3b448; }
    .accent2 { fill: #8fbf5a; }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    .fade { animation: fade 1.2s ease-out both; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .motion { display: none; }
    }
    
    .flow { stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; opacity: .9; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .pulse { transform-box: fill-box; transform-origin: center;
      animation: pulse 3s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .9; }
      to { transform: scale(3.2); opacity: 0; } }
    .wave { animation: drift linear infinite; }
    @keyframes drift { to { transform: translateX(60px); } }
    .draw { stroke-dasharray: 170; animation: draw 1.1s 1s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 170; } }
